<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Secure Access | Petty Cash</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --saf-green: #43B02A;
            --office-blue: #2563EB;
            --office-blue-dark: #1D4ED8;
            --ground-orange: #FF7500;
            --ground-orange-dark: #C25A00;
            --ink: #0F172A;
            --muted: #64748B;
        }

        body, html { 
            margin: 0; padding: 0; 
            height: 100dvh; width: 100%; 
            overflow: hidden; 
            background-color: #ffffff;
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            overscroll-behavior: none;
            -webkit-tap-highlight-color: transparent;
        }

        /* ==========================================
           WHITE BACKGROUND (light, subtle texture)
           ========================================== */
        #bg-static {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1;
            background:
                radial-gradient(circle at 18% 15%, rgba(67, 176, 42, 0.08) 0%, transparent 45%),
                radial-gradient(circle at 85% 80%, rgba(37, 99, 235, 0.07) 0%, transparent 50%),
                radial-gradient(circle at 50% 100%, rgba(255, 117, 0, 0.06) 0%, transparent 55%),
                #ffffff;
        }
        #bg-static::before {
            content: '';
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(15,23,42,0.035) 1px, transparent 1px);
            background-size: 26px 26px;
        }

        /* ==========================================
           SECTION PICKER
           ========================================== */
        #picker-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            display: flex; flex-direction: column; justify-content: center; align-items: center; 
            z-index: 999;
            padding: 20px; box-sizing: border-box;
        }

        .picker-header {
            text-align: center;
            margin-bottom: 34px;
        }
        .picker-header .brand-logo {
            font-size: 2.6rem; color: var(--saf-green); margin-bottom: 8px;
            filter: drop-shadow(0 0 12px rgba(67, 176, 42, 0.25));
        }
        .picker-header .brand-name {
            color: var(--ink); font-size: 1.3rem; font-weight: 800;
            letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 6px;
        }
        .picker-header .brand-sub {
            color: var(--muted); font-size: 0.8rem; font-weight: 500;
            letter-spacing: 0.5px;
        }

        .picker-grid {
            display: flex; gap: 18px;
            width: 100%; max-width: 420px;
        }

        .picker-card {
            flex: 1;
            background: #ffffff;
            border: 1px solid #E2E8F0;
            border-radius: 22px;
            padding: 30px 16px 24px;
            display: flex; flex-direction: column; align-items: center;
            box-shadow: 0 12px 30px rgba(15, 23, 42, 0.08);
            cursor: pointer;
            transition: transform 0.15s ease, border-color 0.2s ease, box-shadow 0.2s ease;
            position: relative;
            overflow: hidden;
        }
        .picker-card:active { transform: scale(0.95); }
        .picker-card.office:hover { border-color: rgba(37, 99, 235, 0.4); box-shadow: 0 16px 34px rgba(37, 99, 235, 0.15); }
        .picker-card.ground:hover { border-color: rgba(255, 117, 0, 0.4); box-shadow: 0 16px 34px rgba(255, 117, 0, 0.15); }

        /* Icon shell with pulsing ring + glow */
        .picker-icon-shell {
            position: relative;
            width: 78px; height: 78px;
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 18px;
        }
        .picker-icon-ring {
            position: absolute; inset: 0;
            border-radius: 50%;
            animation: ringPulse 2.6s ease-out infinite;
        }
        .picker-card.office .picker-icon-ring { border: 2px solid rgba(37, 99, 235, 0.4); }
        .picker-card.ground .picker-icon-ring { border: 2px solid rgba(255, 117, 0, 0.4); animation-delay: 0.3s; }

        @keyframes ringPulse {
            0%   { transform: scale(0.8); opacity: 0.9; }
            70%  { transform: scale(1.35); opacity: 0; }
            100% { transform: scale(1.35); opacity: 0; }
        }

        .picker-icon-wrap {
            position: relative;
            width: 64px; height: 64px;
            border-radius: 18px;
            display: flex; align-items: center; justify-content: center;
            animation: iconFloat 3s ease-in-out infinite;
            z-index: 2;
            overflow: hidden;
        }
        .picker-card.office .picker-icon-wrap {
            background: #EFF4FF;
            box-shadow: 0 10px 22px rgba(37, 99, 235, 0.22), inset 0 0 0 1px rgba(37, 99, 235, 0.15);
        }
        .picker-card.ground .picker-icon-wrap {
            background: #FFF3E9;
            box-shadow: 0 10px 22px rgba(255, 117, 0, 0.22), inset 0 0 0 1px rgba(255, 117, 0, 0.18);
            animation-delay: 0.25s;
        }
        .picker-icon-wrap img {
            width: 62%; height: 62%;
            object-fit: contain;
        }

        @keyframes iconFloat {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50%      { transform: translateY(-6px) rotate(-2deg); }
        }

        .picker-badge {
            position: absolute; top: -4px; right: -4px;
            width: 20px; height: 20px; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 9px; color: white; z-index: 3;
            border: 2px solid #ffffff;
        }
        .picker-card.office .picker-badge { background: var(--saf-green); }
        .picker-card.ground .picker-badge { background: var(--saf-green); }

        .picker-title {
            color: var(--ink); font-size: 1rem; font-weight: 800;
            letter-spacing: 0.5px; margin-bottom: 4px; text-transform: uppercase;
        }
        .picker-desc {
            color: var(--muted); font-size: 0.72rem;
            text-align: center; font-weight: 500; line-height: 1.4;
        }

        .disclaimer-box {
            position: absolute; bottom: 30px;
            font-size: 10px; color: var(--muted);
            text-align: center; width: 100%; line-height: 1.4;
        }
        .disclaimer-highlight {
            color: var(--saf-green); font-weight: 700; letter-spacing: 1px;
        }

        /* Instant hide once a section is chosen — no fade/slide animation */
        #picker-screen.hidden-instant { display: none; }

        /* APP CONTAINER */
        .app-container {
            position: fixed; top: 0; left: 0; width: 100%; height: 100dvh;
            z-index: 10; opacity: 0;
            pointer-events: none; -webkit-overflow-scrolling: touch; 
        }
        .app-container.active {
            opacity: 1; pointer-events: all;
        }

        iframe { width: 100%; height: 100%; border: none; background: #fff; }

    </style>
</head>
<body>

    <div id="bg-static"></div>

    <div id="picker-screen">
        <div class="picker-header">
            <div class="brand-logo"><i class="fas fa-shield-halved"></i></div>
            <div class="brand-name">Cash Management</div>
            <div class="brand-sub">Select your access point</div>
        </div>

        <div class="picker-grid">
            <div class="picker-card office" id="btn-office">
                <div class="picker-icon-shell">
                    <div class="picker-icon-ring"></div>
                    <div class="picker-icon-wrap">
                        <img src="https://images.icon-icons.com/1156/PNG/512/1486565573-microsoft-office_81557.png" alt="Office">
                    </div>
                    <div class="picker-badge"><i class="fas fa-lock"></i></div>
                </div>
                <div class="picker-title">Office</div>
                <div class="picker-desc">Head Office<br>Petty Cash Ledger</div>
            </div>

            <div class="picker-card ground" id="btn-ground">
                <div class="picker-icon-shell">
                    <div class="picker-icon-ring"></div>
                    <div class="picker-icon-wrap">
                        <img src="https://images.rawpixel.com/image_png_800/czNmcy1wcml2YXRlL3Jhd3BpeGVsX2ltYWdlcy93ZWJzaXRlX2NvbnRlbnQvbHIvdjkzNy1hZXctMTY1LnBuZw.png" alt="Ground">
                    </div>
                    <div class="picker-badge"><i class="fas fa-lock"></i></div>
                </div>
                <div class="picker-title">Ground</div>
                <div class="picker-desc">Field Operations<br>Petty Cash Ledger</div>
            </div>
        </div>

        <div class="disclaimer-box">
            PROPERTY OF <span class="disclaimer-highlight">SHWARI MOVERS AND CLEANERS LTD</span><br>
            Finance Team • Cash Management @ 2026
        </div>
    </div>

    <div class="app-container" id="app-wrapper">
        <iframe id="section-frame" src="" allow="accelerometer; autoplay; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe>
    </div>

    <script>
        // SECTION LINKS
        const SECTION_LINKS = {
            office: "https://script.google.com/macros/s/AKfycbxywoO96tuvySMFV8zcP0bU5ic6rsM8ALXhfjyPL4CVkH4g3CJqDAo62yR98BJzhxsukQ/exec",
            ground: "https://script.google.com/macros/s/AKfycbwzmV3rZ-QVIlCQXLug0QbAl_bNxReUNWpMuf-X6Ytu7ESiVvAa2uPy17UM0XnGiOsI/exec"
        };

        // INSTANT SELECT — no timers, no fake progress
        function openSection(key) {
            const frame = document.getElementById('section-frame');
            const picker = document.getElementById('picker-screen');
            const appWrapper = document.getElementById('app-wrapper');

            frame.src = SECTION_LINKS[key];
            picker.classList.add('hidden-instant');
            appWrapper.classList.add('active');
        }

        document.getElementById('btn-office').addEventListener('click', () => openSection('office'));
        document.getElementById('btn-ground').addEventListener('click', () => openSection('ground'));
    </script>
</body>
</html>
